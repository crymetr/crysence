name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build app (PyInstaller)
        run: python tools/build.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\crysence.iss'

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\CrySence\* -DestinationPath "dist\CrySence-portable-$tag.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CrySence-Setup-*.exe
            dist/CrySence-portable-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrySence-build
          path: |
            dist/CrySence-Setup-*.exe
            dist/CrySence-portable-*.zip
