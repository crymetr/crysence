[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crysence"
version = "0.1.0"
description = "Webcam presence lock with owner recognition, meeting-aware, fully local."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "saitaskar" }]
keywords = ["security", "privacy", "webcam", "face-recognition", "screen-lock",
            "windows"]
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "pillow>=10",
    "winotify>=1.1",
    "pystray>=0.19",
    "customtkinter>=5.2",
]

[project.urls]
Homepage = "https://github.com/saitaskar/crysence"
Issues = "https://github.com/saitaskar/crysence/issues"

[project.gui-scripts]
crysence = "crysence.app:main"

[tool.setuptools]
packages = ["crysence"]

[tool.setuptools.package-data]
crysence = ["data/*.onnx"]
